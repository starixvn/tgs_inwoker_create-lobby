variables:
  GITLABCOM_API_URL: https://gitlab.com/api/v4
  GITLABCOM_TOKEN: glpat-YEB21UY6bY8HGs5KpzVk

.sync_nuget_packages_base:
  stage: sync
  tags:
    - docker
  rules:
    - when: manual
  script:
    - export SRC_PACKAGES=$(curl --no-progress-meter "$GITLABCOM_API_URL/projects/20478010/packages?private_token=$GITLABCOM_TOKEN&per_page=$GITLABCOM_PAGE_SIZE&page=$GITLABCOM_PAGE&package_type=nuget" | jq .)
    - |
      echo $SRC_PACKAGES | jq -c '.[]' | while read package; do
        {
          export SRC_PACKAGE_NAME=$(echo $package | jq '.name' | tr -d \")
          export SRC_VERSION=$(echo $package | jq '.version' | tr -d \")
          export SRC_PACKAGE_FILE=$(echo "${SRC_PACKAGE_NAME}.${SRC_VERSION}.nupkg" | tr '[:upper:]' '[:lower:]')
          echo "Download $SRC_PACKAGE_FILE"
          curl --user $GITLABCOM_USER:$GITLABCOM_TOKEN "$GITLABCOM_API_URL/projects/20478010/packages/nuget/download/$SRC_PACKAGE_NAME/$SRC_VERSION/$SRC_PACKAGE_FILE" > $SRC_PACKAGE_FILE
          echo "Upload to git3 $SRC_PACKAGE_FILE"
          curl --request PUT --form package=@"$SRC_PACKAGE_FILE" --user luminet.ci:$GITLAB_TOKEN "$GITLAB_API_URL/projects/1326/packages/nuget/"
        } || true
      done

sync_nuget_packages_page1:
  extends:
    - .sync_nuget_packages_base
  variables:
    GITLABCOM_PAGE: 1
    GITLABCOM_PAGE_SIZE: 100

sync_nuget_packages_page2:
  extends:
    - .sync_nuget_packages_base
  variables:
    GITLABCOM_PAGE: 2
    GITLABCOM_PAGE_SIZE: 100
