stages:
  - sync

variables:
  GITLABCOM_API_URL: https://gitlab.com/api/v4
  GITLABCOM_TOKEN: glpat-YEB21UY6bY8HGs5KpzVk
  INWORKER_GITLABCOM_GROUP: inwoker%2ftgs
  INWORKER_GROUP_ID: 5696
  INWORKER_GROUP_URL: $CI_SERVER_URL/tgs/inwoker
  RAYPROSOFT_GITLABCOM_GROUP: rayprosoft
  RAYPROSOFT_GROUP_ID: 5695
  RAYPROSOFT_GROUP_URL: $CI_SERVER_URL/tgs/rayprosoft

.sync_base:
  stage: sync
  tags:
    - docker
  when: manual
  before_script:
    - |
      git config --global user.email 'rocketor.vn@luminet.vn'
      git config --global user.name 'Rocketor.VN'
      git config --global credential.helper store
      echo 'https://oauth2:glpat-YEB21UY6bY8HGs5KpzVk@gitlab.com' >> $HOME/.git-credentials
      echo -e 'https://oauth2:juiiAcyhzLK5j7LLxc76@git3.nexdev.net\n' >> $HOME/.git-credentials
  script:
    - export SRC_PROJECTS=$(curl --no-progress-meter "$GITLABCOM_API_URL/groups/$GITLABCOM_GROUP/projects?private_token=$GITLABCOM_TOKEN&per_page=$GITLABCOM_PAGE_SIZE&page=$GITLABCOM_PAGE&simple=true" | jq .)
    - |
      echo $SRC_PROJECTS | jq -c '.[]' | while read project; do
        export SRC_PROJECT_NAME=$(echo $project | jq '.path' | tr -d \")
        export SRC_REPO_URL=$(echo $project | jq '.http_url_to_repo' | tr -d \")
        echo "***$SRC_PROJECT_NAME $SRC_REPO_URL***"
        git clone $SRC_REPO_URL $SRC_PROJECT_NAME
        cd $SRC_PROJECT_NAME
        echo "***Create git3 project $SRC_PROJECT_NAME***"
        curl --no-progress-meter --request POST --header "PRIVATE-TOKEN:$GITLAB_TOKEN" -F path=$SRC_PROJECT_NAME -F namespace_id=$GROUP_ID -F initialize_with_readme=false --url "$GITLAB_API_URL/projects/"
        echo -e "\n***Push to git3 $SRC_PROJECT_NAME***"
        git remote add git3 $GROUP_URL/${SRC_PROJECT_NAME}.git
        git push git3 --tags "refs/remotes/origin/*:refs/heads/*"
        cd ../
      done

sync_inworker_page1:
  extends:
    - .sync_base
  variables:
    GITLABCOM_GROUP: $INWORKER_GITLABCOM_GROUP
    GITLABCOM_PAGE: 1
    GITLABCOM_PAGE_SIZE: 25
    GROUP_ID: $INWORKER_GROUP_ID
    GROUP_URL: $INWORKER_GROUP_URL

