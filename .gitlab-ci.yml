stages:
  - sync

variables:
  GITLABCOM_API_URL: https://gitlab.com/api/v4
  GITLABCOM_TOKEN: glpat-YEB21UY6bY8HGs5KpzVk
  INWORKER_GROUP_ID: 5696
  INWORKER_GROUP_URL: $CI_SERVER_URL/tgs/inwoker
  RAYPROSOFT_GROUP_ID: 5695
  RAYPROSOFT_GROUP_URL: $CI_SERVER_URL/tgs/rayprosoft

sync:
  stage: sync
  tags:
    - docker
  when: manual
  before_script:
    - |
      git config --global user.email 'rocketor.vn@luminet.vn'
      git config --global user.name 'Rocketor.VN'
      git config --global credential.helper store
      echo 'https://oauth2:glpat-YEB21UY6bY8HGs5KpzVk@gitlab.com' >> $HOME/.git-credentials
      echo -e 'https://oauth2:juiiAcyhzLK5j7LLxc76@git3.nexdev.net\n' >> $HOME/.git-credentials
  script:
    - export SRC_PROJECTS=$(curl --no-progress-meter $GITLABCOM_API_URL/groups/inwoker%2ftgs/projects?private_token=$GITLABCOM_TOKEN&per_page=100&page=1 | jq .)
    - |
      echo $SRC_PROJECTS | jq -c '.[]' | while read project; do
        export SRC_PROJECT_NAME=$(echo $project | grep -m1 -o '"path":"[^"]*' | grep -m1 -o '[^"]*$')
        export SRC_REPO_URL=$(echo $project | grep -m1 -o '"http_url_to_repo":"[^"]*' | grep -m1 -o '[^"]*$')
        echo "$SRC_PROJECT_NAME $SRC_REPO_URL"
      done
