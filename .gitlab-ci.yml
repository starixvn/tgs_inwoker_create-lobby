stages:
  - sync

variables:
  INWORKER_GROUP_ID: 5696
  INWORKER_GROUP_URL: $CI_SERVER_URL/tgs/inwoker
  RAYPROSOFT_GROUP_ID: 5695
  RAYPROSOFT_GROUP_URL: $CI_SERVER_URL/tgs/rayprosoft

sync:
  stage: sync
  tags:
    - docker
  when: manual
  before_script:
    - |
      git config --global user.email 'rocketor.vn@luminet.vn'
      git config --global user.name 'Rocketor.VN'
      git config --global credential.helper store
      echo 'https://oauth2:glpat-YEB21UY6bY8HGs5KpzVk@gitlab.com' >> $HOME/.git-credentials
      echo -e 'https://oauth2:juiiAcyhzLK5j7LLxc76@git3.nexdev.net\n' >> $HOME/.git-credentials
  script:
    - export PROJECTNAME=tgs-services-api
    - |
      git clone https://gitlab.com/inwoker/tgs/tgs-services-api.git $PROJECTNAME
      cd $PROJECTNAME
    - |
      echo "***Create git3 project***"
      curl --no-progress-meter --request POST --header "PRIVATE-TOKEN:$GITLAB_TOKEN" -F path=$PROJECTNAME -F namespace_id=$INWORKER_GROUP_ID -F initialize_with_readme=false --url "$GITLAB_API_URL/projects/"
    - git remote add git3 $INWORKER_GROUP_URL/${PROJECTNAME}.git
    - git push git3 --tags "refs/remotes/origin/*:refs/heads/*"

